# Render Blueprint for Forge Code Academy — Phase 0 topology.
#
# One service lives here now:
#   * forge-code-academy — the static studio (the SAME `dist/` that `npm run
#                          build` produces). This is the learning surface.
#
# Accounts + progress sync are handled by the Next.js + Supabase app in `web/`,
# deployed SEPARATELY on Vercel (see docs/phase-0-deploy.md). The studio reaches
# it through the legacy-protocol sync bridge (/api/me, /api/auth/*, /api/sync)
# using the FORGE_SYNC_ORIGIN below.
#
# RETIRED: the old ephemeral `forge-sync` Node service (sync-server.mjs) is no
# longer deployed. Supabase is the one durable accounts backend. `sync-server.mjs`
# stays in the repo ONLY as a protocol-conformance fixture for the tests
# (tests/sync-server.test.mjs, tests/sync-client.test.mjs); it is not hosted.
#
# The local C# compiler in server.mjs is loopback-only and is NEVER deployed
# here — it is a separate program from the accounts backend.
#
# Render does NOT read the Netlify-style `dist/_headers` file, so the security
# headers are declared here instead. The values below mirror `dist/_headers`,
# which is generated from `security-policy.mjs` (the single source of truth).
# The Content-Security-Policy is per-document: the app, the DOM lab, and the
# runner worker each get their own policy.
#
# DRIFT WARNING (two things to keep in sync):
#  1. The app CSP pins a sha256 hash of the inline bootstrap script in
#     index.html. If you change that inline script, run `npm run build` and
#     copy the new hash from `dist/_headers` into the three app-CSP entries.
#  2. The app CSP `connect-src` must list the backend origin so the browser may
#     call the sync bridge. It is hardcoded below AND passed to the static build
#     as FORGE_SYNC_ORIGIN so `deployment.js` shows the account UI. This value
#     must equal your real Vercel production URL, and the Vercel app's
#     FORGE_STUDIO_ORIGINS must in turn equal this studio's Render URL. The
#     `https://forge-app.vercel.app` below is a PLACEHOLDER — replace it with the
#     actual production domain Vercel assigns (see docs/phase-0-deploy.md, step 5).
services:
  - type: web
    runtime: static
    name: forge-code-academy
    buildCommand: npm run build
    staticPublishPath: ./dist
    envVars:
      - key: NODE_VERSION
        value: "22"
      # Build-time origin: written into dist/deployment.js and the generated
      # connect-src so the hosted app enables the account features. PLACEHOLDER —
      # set to the real Vercel production URL of the web/ app.
      - key: FORGE_SYNC_ORIGIN
        value: https://forge-app.vercel.app
    headers:
      # Applied to every response (matches the `/*` block in dist/_headers).
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: no-referrer
      - path: /*
        name: Permissions-Policy
        value: "camera=(), microphone=(), geolocation=()"
      - path: /*
        name: Strict-Transport-Security
        value: "max-age=63072000"
      - path: /*
        name: Cross-Origin-Opener-Policy
        value: "same-origin"
      - path: /*
        name: Cache-Control
        value: "public, max-age=0, must-revalidate"
      # App documents: connect-src allows self + the backend origin (Vercel).
      - path: /
        name: Content-Security-Policy
        value: "default-src 'self'; script-src 'self' 'sha256-wVtf6a4QHgMjh+7h5KU6dv08CH6VCRZGMgY7c+/qY4g='; style-src 'self' 'unsafe-inline'; img-src 'self' data: https://cdn.jsdelivr.net/gh/devicons/devicon@v2.16.0/icons/; connect-src 'self' https://forge-app.vercel.app; worker-src 'self'; frame-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'; frame-ancestors 'self'"
      - path: /index.html
        name: Content-Security-Policy
        value: "default-src 'self'; script-src 'self' 'sha256-wVtf6a4QHgMjh+7h5KU6dv08CH6VCRZGMgY7c+/qY4g='; style-src 'self' 'unsafe-inline'; img-src 'self' data: https://cdn.jsdelivr.net/gh/devicons/devicon@v2.16.0/icons/; connect-src 'self' https://forge-app.vercel.app; worker-src 'self'; frame-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'; frame-ancestors 'self'"
      - path: /404.html
        name: Content-Security-Policy
        value: "default-src 'self'; script-src 'self' 'sha256-wVtf6a4QHgMjh+7h5KU6dv08CH6VCRZGMgY7c+/qY4g='; style-src 'self' 'unsafe-inline'; img-src 'self' data: https://cdn.jsdelivr.net/gh/devicons/devicon@v2.16.0/icons/; connect-src 'self' https://forge-app.vercel.app; worker-src 'self'; frame-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'; frame-ancestors 'self'"
      # DOM lab: stricter sandbox policy.
      - path: /dom-preview.html
        name: Content-Security-Policy
        value: "default-src 'none'; script-src 'self' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src data:; connect-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'; frame-ancestors 'self'"
      # JavaScript runner worker: no network, eval only.
      - path: /runner-worker.js
        name: Content-Security-Policy
        value: "default-src 'none'; script-src 'unsafe-eval'; connect-src 'none'"
